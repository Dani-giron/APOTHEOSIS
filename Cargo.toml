[package]
name = "apotheosis2"
version = "0.1.0"
edition = "2024"

[dependencies]
rand_pcg = "0.3.1"
rand_core = "0.6.3"
rand = { version = "0.8", features = ["std_rng"] }
libm = "0.2.1"
tlsh2 = { version = "1.1.0", features = ["diff"] }
serde_json = "1.0.145"
radix-tree = "0.2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
opt-level = 3

[profile.release]
codegen-units = 1
